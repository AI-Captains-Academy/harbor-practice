name: Core check ⚓

# Runs on every pull request and push to main. Green = the core task board still works.
# This is what "don't break the core" means in practice — it's a check, not a vibe.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  core-check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA, not the moving `v4` tag: a tag can be repointed,
      # and this workflow would then run whatever was pushed. Same for setup-node.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Run the core-integrity check
        run: node scripts/check.mjs
