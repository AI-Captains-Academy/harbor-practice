<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Captain's Log ⚓</title>

  <!--
    Welcome to the Captain's Log.

    This whole app is ONE file: HTML here, CSS in the <style> block below, and
    JavaScript in the <script> block at the very bottom. No build step. No install.
    Open this file in a browser and it runs.

    New here? Read START-HERE.md in the repo root, or hand it to your AI agent.
    Then read PLAN.md for a task to build. Keep this file readable for the next beginner.
  -->

  <style>
    :root {
      --bg: #0e1017;
      --card: #171a24;
      --line: #262a38;
      --text: #e7e9f0;
      --muted: #9aa0b4;
      --lime: #b6ff3b;   /* AI Captains / Mode A signal color */
      --violet: #8b7cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .app { width: 100%; max-width: 32rem; }
    header { margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0; }
    .tagline { color: var(--muted); font-size: 0.9rem; margin-top: 0.25rem; }

    form { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    input[type="text"] {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    input[type="text"]:focus { outline: 2px solid var(--violet); }
    button {
      padding: 0.7rem 1rem;
      border: none;
      border-radius: 0.6rem;
      background: var(--lime);
      color: #0e1017;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { filter: brightness(1.05); }

    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
    li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 0.9rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
    }
    li .task-text { flex: 1; word-break: break-word; }
    li.done .task-text { color: var(--muted); }
    li input[type="checkbox"] { width: 1.1rem; height: 1.1rem; cursor: pointer; accent-color: var(--lime); }
    .delete {
      background: transparent;
      color: var(--muted);
      font-size: 1.2rem;
      padding: 0 0.4rem;
      line-height: 1;
    }
    .delete:hover { color: #ff6b6b; }

    footer { margin-top: 2rem; color: var(--muted); font-size: 0.8rem; text-align: center; }
    footer a { color: var(--violet); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Captain's Log ⚓</h1>
      <p class="tagline">A tiny crew task board. Break it, build it, ship a PR.</p>
    </header>

    <!-- Add-a-task form. The JS listens for its submit event. -->
    <form id="task-form">
      <input id="task-input" type="text" placeholder="What needs doing?" autocomplete="off" />
      <button type="submit">Log it</button>
    </form>

    <!-- Tasks get rendered into this list by renderTasks(). -->
    <ul id="task-list"></ul>

    <footer>
      Part of <a href="https://github.com/AI-Captains-Academy/harbor-practice">harbor-practice</a>
      — an AI Captains project. Your feature could go right here.
    </footer>
  </div>

  <script>
    // ---- Captain's Log: the core task board ----
    // The four things this app must always do: add, complete, delete, and remember.
    // If you keep those working, you can change almost anything else. Have fun.

    const STORAGE_KEY = "harbor-practice-tasks";

    // Load tasks from localStorage (or start empty). This is the "remember" part.
    let tasks = loadTasks();

    const form = document.getElementById("task-form");
    const input = document.getElementById("task-input");
    const list = document.getElementById("task-list");

    // ADD a task when the form is submitted.
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;                     // ignore empty input
      tasks.push({ id: Date.now(), text: text, done: false });
      input.value = "";
      saveTasks();
      renderTasks();
    });

    // COMPLETE or DELETE, using event delegation on the list.
    list.addEventListener("click", function (event) {
      const li = event.target.closest("li");
      if (!li) return;
      const id = Number(li.dataset.id);

      if (event.target.matches("input[type=checkbox]")) {
        const task = tasks.find((t) => t.id === id);
        if (task) task.done = event.target.checked;   // COMPLETE
        saveTasks();
        renderTasks();
      }

      if (event.target.matches(".delete")) {
        tasks = tasks.filter((t) => t.id !== id);      // DELETE
        saveTasks();
        renderTasks();
      }
    });

    // Draw the current tasks into the page.
    function renderTasks() {
      list.innerHTML = "";
      for (const task of tasks) {
        const li = document.createElement("li");
        li.dataset.id = task.id;
        if (task.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = task.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.type = "button";
        del.setAttribute("aria-label", "Delete task");
        del.textContent = "×";

        li.append(checkbox, span, del);
        list.append(li);
      }
    }

    // ---- localStorage helpers (the "remember" part) ----
    function loadTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch (e) {
        return [];
      }
    }
    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    // First paint.
    renderTasks();
  </script>
</body>
</html>
